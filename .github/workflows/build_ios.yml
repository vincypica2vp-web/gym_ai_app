name: Build iOS App

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Clone repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: 'any'
        channel: 'stable'

    - name: Install dependencies
      run: flutter pub get

    - name: Build iOS (Release unsigned)
      run: flutter build ios --release --no-codesign --dart-define=OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
    
    - name: Upload iOS Build
      uses: actions/upload-artifact@v4
      with:
        name: ios-app
        path: build/ios/iphoneos/Runner.app